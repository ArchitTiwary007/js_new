<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chai aur code : DOM</title>
</head>
<body style="background-color: rgb(39, 18, 58);color:rgb(187, 232, 247)">
    <ul class="language">
        <li>Javascript!!</li>
    </ul>
</body>
<script>
    function addLanguage(language){
        const li = document.createElement('li');
        li.innerHTML=`${language}`;
        document.querySelector('.language').appendChild(li);
    }
    addLanguage('Python');
    addLanguage('Typescript');

    //optimised(Recommended)
    function optiLang(language){
        const li=document.createElement('li');
        li.appendChild(document.createTextNode(language));//++++//
        document.querySelector('.language').appendChild(li);
    }
    optiLang('C++');
    optiLang('Java');
    optiLang('Swift');

    //Edit
    const secondLang=document.querySelector("li:nth-child(3)")
    console.log(secondLang);
    // secondLang.innerHTML="Rust";
    const newli = document.createElement('li')
    newli.textContent="Rust";//++++//
    secondLang.replaceWith(newli);//++++//

    //Edit
    const firstLang=document.querySelector("li:first-child")
    firstLang.outerHTML='<li>HTML</li>';

    //Remove
    const lastLang=document.querySelector('li:last-child');
    lastLang.remove();
</script>
</html>
